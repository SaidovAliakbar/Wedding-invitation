<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RSVP Admin</title>
  <style>
    :root{color-scheme:dark;--bg:#11100f;--card:#1b1917;--line:#38312b;--text:#f4ede4;--muted:#aa9f93;--accent:#d9b98d;--danger:#d77f7f;}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#282019 0,#11100f 45%);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}
    .wrap{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:34px 0 50px}.card{background:rgba(27,25,23,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .login{width:min(420px,100%);margin:10vh auto 0;padding:28px}.hidden{display:none!important}h1{margin:0 0 8px;font-size:28px}h2{margin:0;font-size:18px}.muted{color:var(--muted)}
    label{display:block;margin:18px 0 7px;color:var(--muted)}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#12100f;color:var(--text);outline:0}input:focus{border-color:var(--accent)}
    button{border:0;border-radius:11px;padding:12px 16px;cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#21180f}button.ghost{background:#27221e;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:not-allowed}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px}.num{font-size:30px;font-weight:800}.label{color:var(--muted);margin-top:4px}
    .table-card{overflow:hidden}.table-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:13px}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.yes{background:rgba(102,180,127,.15);color:#8bd0a3}.no{background:rgba(215,127,127,.12);color:#ea9b9b}.empty{padding:35px;text-align:center;color:var(--muted)}.error{margin-top:12px;color:#f0a1a1;min-height:22px}.login small{display:block;margin-top:12px;color:var(--muted)}
    @media (max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding-top:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginCard" class="card login">
      <h1>RSVP Admin</h1>
      <div class="muted">Просмотр ответов гостей</div>
      <form id="loginForm">
        <label for="password">Пароль администратора</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div id="loginError" class="error"></div>
        <button class="primary" type="submit" id="loginBtn">Войти</button>
      </form>
      <small>Пароль хранится только как Worker Secret и не находится в коде сайта.</small>
    </section>

    <section id="app" class="hidden">
      <div class="top">
        <div><h1>Ответы гостей</h1><div class="muted">Обновляется вручную по кнопке ниже.</div></div>
        <div style="display:flex;gap:8px"><button class="ghost" id="refresh">Обновить</button><button class="ghost" id="logout">Выйти</button></div>
      </div>
      <div class="stats">
        <div class="card stat"><div class="num" id="total">0</div><div class="label">Всего ответов</div></div>
        <div class="card stat"><div class="num" id="yes">0</div><div class="label">Придут</div></div>
        <div class="card stat"><div class="num" id="no">0</div><div class="label">Не придут</div></div>
      </div>
      <section class="card table-card">
        <div class="table-head"><h2>Гости</h2><div class="muted" id="updated"></div></div>
        <div class="scroll">
          <table><thead><tr><th>Имя</th><th>Ответ</th><th>Дата</th></tr></thead><tbody id="rows"></tbody></table>
        </div>
        <div id="empty" class="empty hidden">Пока никто не ответил.</div>
      </section>
    </section>
  </main>
<script>
  const $=s=>document.querySelector(s);
  const loginCard=$('#loginCard'),app=$('#app'),rows=$('#rows'),empty=$('#empty');
  async function api(url,options={}){const r=await fetch(url,{...options,credentials:'same-origin'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
  function showApp(){loginCard.classList.add('hidden');app.classList.remove('hidden');load()}
  async function load(){
    try{
      const data=await api('/api/admin/rsvps');
      $('#total').textContent=data.total;$('#yes').textContent=data.yes;$('#no').textContent=data.no;
      rows.innerHTML='';empty.classList.toggle('hidden',data.rows.length>0);
      for(const item of data.rows){const tr=document.createElement('tr');const badge=item.attendance==='yes'?'yes':'no';tr.innerHTML=`<td>${escapeHtml(item.name)}</td><td><span class="badge ${badge}">${item.attendance==='yes'?'Придёт':'Не придёт'}</span></td><td>${formatDate(item.created_at)}</td>`;rows.appendChild(tr)}
      $('#updated').textContent='Обновлено: '+new Date().toLocaleTimeString('ru-RU');
    }catch(e){if(e.message==='UNAUTHORIZED'){loginCard.classList.remove('hidden');app.classList.add('hidden');return}alert(e.message)}
  }
  function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function formatDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#loginBtn'),err=$('#loginError');btn.disabled=true;err.textContent='';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});showApp()}catch(e){err.textContent='Неверный пароль'}finally{btn.disabled=false}});
  $('#refresh').onclick=load;
  $('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}finally{location.reload()}};
  load().then(()=>{});
</script>
</body>
</html>
